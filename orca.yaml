scripts:
  setup: |
    # Copie les fichiers d'env (ignorés par git) depuis le dépôt principal
    for f in .env .env.test; do
      if [ -f "$ORCA_ROOT_PATH/$f" ] && [ ! -f "$f" ]; then
        cp "$ORCA_ROOT_PATH/$f" "$f"
      fi
    done
    # Ports, projet docker compose et bases isolés par worktree
    sh scripts/orca-worktree-env.sh
    pnpm install

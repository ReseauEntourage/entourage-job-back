name: Release Please

on:
  push:
    branches: [master]

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          target-branch: master

      - name: Notify Slack — release pull request opened or updated
        if: steps.release.outputs.pr != ''
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ${{ toJSON(format('📦 entourage-job-back : PR de release ouverte/à jour — {0}\n{1}', fromJson(steps.release.outputs.pr).title, fromJson(steps.release.outputs.pr).html_url)) }}
            }

  deploy:
    name: Deploy to production
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    environment: entourage-job-back-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The release commit only bumps the version and the changelog, so its own push
      # to `master` does not need a CI run (ci.yml skips it, see the `setup` job).
      # What gets deployed was already tested by the CI run on the previous commit
      # of `master` (the merge of `develop`, a Pull Request-validated change set):
      # wait for that run and require success. If a commit in the chain has no CI run
      # (e.g. a former release commit), walk back along the first parents.
      - name: Wait for CI to pass on the previously merged commit
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            let sha = context.sha;
            let run;
            for (let depth = 0; depth < 5 && !run; depth++) {
              const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: sha });
              sha = commit.parents[0]?.sha;
              if (!sha) break;
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'ci.yml',
                head_sha: sha,
                event: 'push',
              });
              run = data.workflow_runs[0];
            }
            if (!run) {
              core.setFailed('No ci.yml run found on the commits preceding the release commit');
              return;
            }
            core.info(`Checking CI run ${run.html_url} for ${sha}`);
            let conclusion = run.status === 'completed' ? run.conclusion : undefined;
            for (let i = 0; i < 60 && !conclusion; i++) {
              await new Promise((resolve) => setTimeout(resolve, 30000));
              const { data } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: run.id });
              if (data.status === 'completed') conclusion = data.conclusion;
            }
            if (conclusion !== 'success') {
              core.setFailed(`ci.yml did not complete successfully for ${sha} (conclusion: ${conclusion ?? 'timed out waiting'})`);
            }

      - name: Deploy to Heroku
        run: |
          git push "https://heroku:${HEROKU_API_KEY}@git.heroku.com/entourage-job.git" "HEAD:refs/heads/main"
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}

      - name: Notify Slack — release deployed
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ${{ toJSON(format('🚀 entourage-job-back {0} déployé en production', needs.release-please.outputs.tag_name)) }}
            }

name: Entourage Pro - Back CI

on:
  push:
    branches: [master, develop]
  pull_request: {}
  workflow_dispatch:

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

  ts-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:ts-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:eslint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [ts-check, lint, build]
    environment: entourage-job-back-test

    services:
      postgres:
        image: pgvector/pgvector:pg17-bookworm
        env:
          POSTGRES_USER: entourage_pro
          POSTGRES_PASSWORD: entourage_pro
          POSTGRES_DB: entourage_pro
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
      OPENAI_API_KEY: ''
      SHORTIO_DOMAIN: test.short.io
      SHORTIO_API_KEY: test_api_key
      # Fake S3 config: `Media`'s AfterFind hook presigns a URL for every media
      # it loads, and presigning is pure local crypto — it needs a bucket name
      # and credentials to be set, but never reaches AWS. Deliberately invalid
      # so a test that would really call S3 fails instead of hitting a bucket.
      AWSS3_BUCKET_NAME: test-bucket
      AWSS3_IMAGE_DIRECTORY: images/
      AWSS3_FILE_DIRECTORY: files/
      AWSS3_ID: test-access-key-id
      AWSS3_SECRET: test-secret-access-key
      AWSS3_URL: https://test-bucket.s3.eu-west-3.amazonaws.com/

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm db:migrate
      - run: pnpm test:e2e

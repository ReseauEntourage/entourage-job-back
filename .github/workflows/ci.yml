name: Entourage Pro - Back CI

on:
  push:
    branches: [master, develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

  ts-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:ts-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:eslint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build

  e2e:
    name: E2E Tests
    # Costly tests only run once the PR is ready for review (not while in draft)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    needs: [ts-check, lint, build]
    environment: entourage-job-back-test

    services:
      postgres:
        image: pgvector/pgvector:pg17-bookworm
        env:
          POSTGRES_USER: entourage_pro
          POSTGRES_PASSWORD: entourage_pro
          POSTGRES_DB: entourage_pro
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      NODE_ENV: test
      # Not a secret: points at the postgres service container below. Hardcoded so
      # Dependabot PRs (which can't read Actions secrets) get a valid URL.
      DATABASE_URL: postgres://entourage_pro:entourage_pro@localhost:5432/entourage_pro
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-jwt-secret' }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN || 'xoxb-ci-test' }}
      SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET || 'ci-test-signing-secret' }}
      SHORTIO_DOMAIN: test.short.io
      SHORTIO_API_KEY: test_api_key
      AWSS3_BUCKET_NAME: test-bucket
      AWSS3_IMAGE_DIRECTORY: images/
      AWSS3_FILE_DIRECTORY: files/
      AWSS3_ID: test-access-key-id
      AWSS3_SECRET: test-secret-access-key
      AWSS3_URL: https://test-bucket.s3.eu-west-3.amazonaws.com/

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm db:migrate
      - run: pnpm test:e2e
        env:
          # --runInBand keeps every suite in one process; the default 4 GB heap is
          # exhausted once the suite count passes ~120 (runner has 16 GB).
          NODE_OPTIONS: --max-old-space-size=8192
